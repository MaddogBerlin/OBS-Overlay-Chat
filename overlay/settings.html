<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=settings/settingsBase.html">

  <title>Browser Chat Settings v1.4</title>

  <script>
    window.location.replace(
      new URL("settings/settingsBase.html", window.location.href).href
    );
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      color: #f7f3f8;
      background: #080b12;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 28px;
      text-align: center;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      color: #ff8791;
      font-size: clamp(1.3rem, 4vw, 2rem);
    }

    p {
      color: #aaa4af;
    }

    a {
      margin-top: 8px;
      padding: 10px 16px;
      border: 1px solid #ff8791;
      border-radius: 10px;
      color: #f7f3f8;
      text-decoration: none;
      background: rgba(255, 95, 109, 0.1);
    }

    a:hover,
    a:focus-visible {
      background: rgba(255, 95, 109, 0.2);
      outline: none;
      box-shadow: 0 0 18px rgba(255, 95, 109, 0.25);
    }
  </style>
</head>

<body>
  <main>
    <h1>Browser Chat Settings</h1>
    <p>Die Einstellungen werden geöffnet …</p>

    <a href="settings/settingsBase.html">
      Settings jetzt öffnen
    </a>

    <noscript>
      <p>JavaScript ist deaktiviert. Bitte verwende den Link.</p>
    </noscript>
  </main>
</body>
</html>
